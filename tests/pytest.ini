[pytest]
# Put the repo root on sys.path so tests can ``from tests.regression.X import Y``
# regardless of pytest's working directory. CI runs pytest from ./tests,
# whereas local invocations typically run from the repo root.
pythonpath = ..
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
env =
    SCIRIS_BACKEND=agg
markers =
    slow: reserved; the expensive statistical gates now live in ../devtests