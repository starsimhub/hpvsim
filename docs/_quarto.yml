project:
  type: website
  pre-render: python quarto_utils.py pre
  post-render: python quarto_utils.py post
  output-dir: _site
  title: "HPVsim"
  execute-dir: file

website:
  title: "HPVsim"
  image: /assets/starsim-logo.png
  favicon: /assets/favicon.ico

  repo-url: https://github.com/starsimhub/hpvsim
  repo-actions: [issue]
  page-navigation: true
  search:
    type: overlay

  page-footer:
    center: "Docs built for HPVsim v{{< var version >}} ({{< var versiondate >}}).<br>© 2020–2026, Gates Foundation. All rights reserved. [Privacy and Cookies Notice](https://www.gatesfoundation.org/Privacy-and-Cookies-Notice) | [Terms of Use](https://www.gatesfoundation.org/Terms-of-Use)"
    right:
      - icon: github
        href: https://github.com/starsimhub/hpvsim
        aria-label: GitHub
      - icon: envelope-at-fill
        href: mailto:info@hpvsim.org
      - icon: globe
        href: https://hpvsim.org/

  navbar:
    logo: /assets/starsim-logo.png
    title: false
    collapse-below: lg

    tools:
      - icon: github
        href: https://github.com/starsimhub/hpvsim
      - icon: envelope-at-fill
        href: mailto:info@hpvsim.org
      - icon: globe
        href: https://hpvsim.org

    left:
      - text: Home
        href: index.md
      - text: Overview
        href: overview.md
      - text: What's new
        href: whats-new.md
      - text: Migrating from v2
        href: migration.qmd
      - text: Tutorials
        href: tutorials.md
      - text: Code of conduct
        href: conduct.md
      - text: API reference
        href: api/index.qmd

  sidebar:
    - id: main
      collapse-level: 3
      contents:
        - text: "**Home**"
          href: index.md
        - text: "**Overview**"
          href: overview.md
        - text: "**What's new**"
          href: whats-new.md
        - text: "**Migrating from v2**"
          href: migration.qmd
        - section: "**Tutorials**"
          contents:
            - tutorials/tut_intro.qmd
            - tutorials/tut_plotting.qmd
            - tutorials/tut_running.qmd
            - tutorials/tut_people.qmd
            - tutorials/tut_interventions.qmd
            - tutorials/tut_analyzers.qmd
            - tutorials/tut_calibration.qmd
        - href: conduct.md
          text: "**Code of conduct**"
        - text: "**API reference**"
          href: api/index.qmd
    - id: api
      collapse-level: 3
      contents:
        - text: "**Home**"
          href: index.md
        - text: "**API reference**"
          href: api/index.qmd
        - section: "**Modules**"
          contents:
            - api/analyzers.qmd
            - api/calibration.qmd
            - api/cross_genotype.qmd
            - api/defaults.qmd
            - api/demographics.qmd
            - api/hiv.qmd
            - api/hpv.qmd
            - api/interventions.qmd
            - api/migration_utils.qmd
            - api/misc.qmd
            - api/network.qmd
            - api/parameters.qmd
            - api/plotting.qmd
            - api/products.qmd
            - api/seeding.qmd
            - api/settings.qmd
            - api/sim.qmd
            - api/utils.qmd
            - api/data.downloaders.qmd
            - api/data.loaders.qmd

format:
  html:
    theme:
      light: [cosmo, ./assets/styles-light.scss]
      dark: [cosmo, ./assets/styles-dark.scss]
    css: ./assets/styles.css
    toc: true
    toc-expand: 3
    toc-depth: 5
    highlight-style: github

filters:
  - machow/interlinks

interlinks:
  fast: false
  sources:
    python:
      url: https://docs.python.org/3/
    numpy:
      url: https://numpy.org/doc/stable/
    pandas:
      url: https://pandas.pydata.org/pandas-docs/stable/
    scipy:
      url: https://docs.scipy.org/doc/scipy/
    matplotlib:
      url: https://matplotlib.org/stable/
    sciris:
      url: https://docs.sciris.org/en/latest/
    starsim:
      url: https://docs.starsim.org/
  autolink: true
  aliases:
    numpy: [np]
    pandas: [pd]
    matplotlib: [plt]
    sciris: [sc]
    starsim: [ss]
    hpvsim: [null, hpv]

quartodoc:
  package: hpvsim
  title: API reference
  style: pkgdown
  dir: api
  parser: google
  render_interlinks: true
  sections:
    - title: API reference
      desc: Full details on all HPVsim classes and functions.
      contents:
        - analyzers
        - calibration
        - cross_genotype
        - defaults
        - demographics
        - hiv
        - hpv
        - interventions
        - migration_utils
        - misc
        - network
        - parameters
        - plotting
        - products
        - seeding
        - settings
        - sim
        - utils
        - data.downloaders
        - data.loaders

execute:
  freeze: auto
  cache: true
  error: false
  echo: true
  warning: true
